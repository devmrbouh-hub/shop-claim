name: verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test Bridge
        run: |
          cd bridge
          pip install -e ".[dev]"
          pytest -q

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test Portal
        run: |
          cd bridge
          pip install -e ".[dev]"
          cd ../portal/backend
          pip install -e ".[dev]"
          pip install -e ../../bridge
          pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json
      - name: Build SPA and landing
        run: |
          cd portal/frontend
          npm ci
          npm run build
          npm run build:landing
